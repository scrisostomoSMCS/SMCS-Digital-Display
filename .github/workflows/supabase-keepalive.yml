
# Keeps the Supabase free-tier project from pausing due to inactivity.
# Location in repo: .github/workflows/supabase-keepalive.yml
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       e.g. https://abcdefgh.supabase.co   (PRODUCTION project)
#   SUPABASE_ANON_KEY  the anon/public key (same one the bulletin already uses)
#
# Change PING_TABLE to a small table the anon role can read under RLS.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 15 * * *"   # daily, ~8:17am Pacific (cron is UTC; off-the-hour avoids GitHub's :00 backlog)
  workflow_dispatch:        # lets you run it manually from the Actions tab

env:
  PING_TABLE: announcements   # <-- change me

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing"
            exit 1
          fi

          status=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/$PING_TABLE?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP $status"
            cat /tmp/body.json
            exit 1
          fi
          echo "Supabase is awake."
